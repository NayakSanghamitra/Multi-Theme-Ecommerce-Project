name: Build and Deploy Nuxt Application

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Grant workflow permissions to publish to GitHub Pages
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # Generates static HTML, JS, and CSS files in .output/public
      - name: Generate Static Site
        run: npx nuxi generate

      # Automatically publishes static files to the gh-pages branch
      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .output/public
          branch: gh-pages
