name: Build Nuxt Application

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Use npm install with legacy peer deps to bypass lockfile errors
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run Build Test
        run: npm run build
